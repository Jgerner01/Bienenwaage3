; Bienenwaage3 – PlatformIO Konfiguration
; Hardware: WT32-ETH01-V1.4 (ESP32 + LAN8720 Ethernet)

; ── Gemeinsame Einstellungen ───────────────────────────────────────────────────
[common]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFIRMWARE_VERSION='"1.0.0"'
    -DBUILD_DATE='"${__DATE__}"'
    ; Debugging aktivieren: -DDEBUG_SERIAL

lib_deps =
    olkal/HX711_ADC @ ^1.2.9
    esphome/AsyncTCP-esphome @ ^2.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.1.0
    knolleary/PubSubClient @ ^2.8.0
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    bblanchon/ArduinoJson @ ^7.0.0
    ; ArduinoOTA ist im ESP32-Arduino-Core enthalten (kein extra lib_dep)

; ── Normaler USB-Upload ────────────────────────────────────────────────────────
[env:wt32-eth01]
platform      = espressif32
board         = wt32-eth01
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.filesystem = littlefs
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}

; ── Debug über serielle Schnittstelle (kein JTAG-Adapter nötig) ───────────────
[env:wt32-eth01-debug]
extends       = env:wt32-eth01
build_flags   =
    ${common.build_flags}
    -DDEBUG_SERIAL
    -DCORE_DEBUG_LEVEL=3

; ── OTA-Upload über Netzwerk ──────────────────────────────────────────────────
; Verwendung:
;   Windows: set OTA_IP=192.168.1.xxx && set OTA_PASS=bienenwaage3ota
;   Linux:   export OTA_IP=192.168.1.xxx OTA_PASS=bienenwaage3ota
;   dann:    pio run -e wt32-eth01-ota -t upload
[env:wt32-eth01-ota]
extends       = env:wt32-eth01
upload_protocol = espota
upload_port     = ${sysenv.OTA_IP}
upload_flags    =
    --auth=${sysenv.OTA_PASS}
    --port=3232
